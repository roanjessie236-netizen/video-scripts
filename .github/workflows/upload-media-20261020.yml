name: Assemble authorized local Lu Xun media

on:
  push:
    branches: [main]
    paths:
      - projects/luxun-90-memorial/assets/web/W40/clips/_upload/plan-20261020.json

permissions:
  contents: write

concurrency:
  group: luxun-local-media-20261020
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'roanjessie236-netizen/video-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and assemble the approved local media
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 projects/luxun-90-memorial/assets/web/W40/clips/_upload/assemble_uploaded_media.py
