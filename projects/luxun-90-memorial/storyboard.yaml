meta:
  title: 忘记我
  subtitle: 鲁迅逝世九十周年（1936—2026）
  version: v2.4
  date: 2026-10-19
  master: B站横屏母版 16:9 · 4K/25fps · 目标时长 20 分钟以内
  vo_rate: 4.2
  quote_rate: 3.3
  gap: 0.6
chapters:
- id: S0
  title: 序
  years: 1936.9.5 — 1936.10.22
  theme: 一份不让人纪念的遗嘱
  shots:
  - id: S0-01
    dur: 6
    visual: 黑场。极近景：钢笔尖在泛黄稿纸上写出一个字“死”，墨迹慢慢洇开。右下角浮出小字“1936年9月5日”。
    audio:
    - sfx: 钢笔划纸声；远处旧挂钟滴答
    assets: [W01, M01]
  - id: S0-02
    dur: 14
    visual: 《死》原文竖排逐行浮现（仿宋），其余文字虚化，只有被朗读的两行清晰。
    audio:
    - vo: 五十五岁那年秋天，他给家人写下几条遗嘱。
    - q: Q71
    - q: Q01
    assets: [W01, M01]
  - id: S0-03
    dur: 8
    visual: 其余文字褪去，只剩“忘记我”三个字缓缓放大，墨色压满画面。
    audio:
    - q: Q02
    - mus: 大提琴长音进入（极弱）
    assets: [M01]
  - id: S0-04
    dur: 15
    visual: 1936年10月留影，极慢推近到眼睛；画面边缘叠出日历纸“十月十九日”。
    audio:
    - vo: 写下这几行字之后的第四十四天，1936年10月19日清晨5点25分，在上海大陆新村九号的寓所里，他停止了呼吸，终年五十五岁。
    assets: [HZ-p231, W11]
  - id: S0-05
    dur: 14
    visual: 殡仪照片→覆在灵柩上的“民族魂”白旗→送葬人群（历史影像，慢放）。
    audio:
    - vo: 他不让人纪念。可是出殡那天，许多素不相识的人自发走进送葬的队伍。覆在灵柩上的白旗，写着三个字：民族魂。
    - sfx: 历史影像底噪；人群脚步声
    assets: [QJ-p6081, W02, W38, W03]
    note: “民族魂”为沈钧儒书（已核）；送葬人数不写具体数字，若要写须先完成 W03 核实。 送葬人群优先用 W38 的1936年丧仪纪录影像（原始黑白，不上色、不做AI修复），角标注“1936年丧仪纪录影像”。 W38 目前没有可用卷片：授权落实前，改用沙飞等人所摄葬仪照片（W02、QJ-p6081）缓推，不用网上转载的视频。
  - id: S0-06
    dur: 11
    visual: 片名卡：手写体“忘记我”（非鲁迅集字，见 W28），下方“鲁迅逝世九十周年 1936—2026”。
    audio:
    - vo: 九十年过去了，我们没有听他的话。这一次，就当是写给先生的一封回信。
    - mus: 主题旋律（钢琴+大提琴）第一次完整出现
    assets: [M02]
- id: S1
  title: 一｜绍兴
  years: 1881—1898
  theme: 坠入困顿
  turn: 第一次转身：在柜台前，他看见了人心
  shots:
  - id: S1-01
    dur: 6
    visual: 章节卡“一｜绍兴 1881—1898 坠入困顿”，叠化到绍兴城远景老照片。
    audio:
    - sfx: 乌篷船摇橹声、水声
    - mus: 古琴单音
    assets: [HZ-p4, W04]
  - id: S1-02
    dur: 13
    visual: 周家老宅→“翰林”匾→祖父周福清像，慢摇。
    audio:
    - vo: 1881年9月25日，他出生在浙江绍兴东昌坊口的周家新台门，本名周樟寿。祖父周福清是翰林，在京城做官。
    assets: [HZ-p6, HZ-p7, HZ-p9]
  - id: S1-03
    dur: 15
    visual: 木刻风动画：衙门高墙、铁锁合上；转到父亲像，色调骤冷。
    audio:
    - vo: 1893年秋天，祖父因科场案下狱，家道从此中落。第二年冬天，父亲病倒。十三岁的长子，开始替这个家奔走。
    - sfx: 铁锁合上
    assets: [M03, HZ-p10]
  - id: S1-04
    dur: 21
    visual: 木刻风动画：少年踮脚，把衣物举过高出自己一倍的当铺柜台；再转到药店——柜台和他一样高。镜头始终在少年视线高度。
    audio:
    - q: Q05
    - sfx: 算盘珠声；当铺伙计报价的含混人声
    assets: [M04]
    note: 视频号精华版、抖音E1核心镜头。
  - id: S1-05
    dur: 15
    visual: 木刻风动画：芦根、经霜的甘蔗、一对蟋蟀、平地木依次排开，像一张药方。最后一盏油灯熄灭。
    audio:
    - q: Q49
    - vo: 1896年10月，父亲还是走了，年仅三十七岁。
    assets: [M05]
  - id: S1-06
    dur: 17
    visual: 黑底白字逐字出现原文；随后转身字卡“第一次转身｜在柜台前，他看见了人心”。
    audio:
    - q: Q06
    - vo: 这是他的第一次转身：在柜台前，他看见了人心。
    assets: [M02]
  - id: S1-07
    dur: 23
    visual: 维新报刊书影→南京旧照；母亲鲁瑞像，停留；最后乌篷船驶出画面，水面留下一道波纹。
    audio:
    - vo: 1898年，他决定去南京，进不收学费的新式学堂——
    - q: Q07
    - q: Q08
    - sfx: 摇橹声渐远
    assets: [HZ-p11, W05, HZ-p10, W04, W42]
    note: 可选：乌篷船驶出处可用 W42 赵延年木刻《离家》（ART-05）代替木刻风动画，只做缓推。
- id: S2
  title: 二｜南京·东京·仙台
  years: 1898—1909
  theme: 弃医从文
  turn: 第二次转身：放下手术刀，去医治人的精神
  shots:
  - id: S2-01
    dur: 5
    visual: 章节卡“二｜南京·东京·仙台 1898—1909 弃医从文”，叠化到江南水师学堂/矿路学堂旧址。
    audio:
    - mus: 主题旋律变奏（节奏加快）
    assets: [W05]
    note: W05 第四轮找到的外景是今南京鲁迅纪念馆（南师附中内），哪栋楼对应当年学堂仍有歧义：如用，字幕只写“南京鲁迅纪念馆（南师附中内，今貌）”，不说是当年的教室或宿舍；没有合格高清前只用章节卡。
  - id: S2-02
    dur: 16
    visual: 《天演论》早期书影，书页翻动；字幕标出“物竞天择”。
    audio:
    - vo: 在南京矿路学堂，他一有闲空，就读严复译的《天演论》。
    - q: Q52
    assets: [W05]
    note: Q52 为1932年的回顾，此处作为“当年的信念”，第五章还会回响一次。
  - id: S2-03
    dur: 16
    visual: 1903年东京“断发照”缓推→《自题小像》诗句手迹。
    audio:
    - vo: 1902年，他官费留学日本。第二年，他剪掉辫子，在这张照片背面题诗，送给好友许寿裳——
    - q: Q09
    assets: [QJ-p97, HZ-p24, HZ-p18, W42]
    note: 全集年表：1903年“写七绝诗《自题小像》于‘断发照’背面，赠许寿裳”。HZ-p24 手迹版本（1903或1931重写）需在字幕中如实标注。 可选：诗句手迹之后可接 W42 黄新波木刻《鲁迅诗意·我以我血荐轩辕》（ART-01）。
  - id: S2-04
    dur: 17
    visual: 仙台医专旧照→仙台住处；一张空课桌。
    audio:
    - vo: 1904年秋，他进了仙台医学专门学校。他的梦想很具体——
    - q: Q51
    assets: [HZ-p30, HZ-p31, W06]
  - id: S2-05
    dur: 15
    visual: 藤野严九郎像→解剖学笔记原件（红笔批改特写）。
    audio:
    - vo: 解剖学教授藤野严九郎，每星期都要看他的笔记。还回来的时候——
    - q: Q13
    assets: [HZ-p33, HZ-p34, W06]
    note: 笔记原件藏北京鲁迅博物馆（现藏待馆方确认）；W06 网图是东北大学展陈的仿制品，用时须标“复制品”。
  - id: S2-06
    dur: 29
    visual: 字幕“仙台医专·细菌学课·日俄战争幻灯片”。木刻风动画：幻灯片光束里，一个中国人被绑在中间，左右围着体格强壮、神情麻木的看客；反打——黑暗讲堂里，一排日本学生举手欢呼，角落里坐着一个中国青年。画面字幕：“据解说：绑着的人替俄国做军事侦探，将被日军砍头示众”。最后定格在青年的侧脸。静音时画面下方小字：“这张幻灯片至今没有找到，画面为木刻风重现。”
    audio:
    - sfx: 放映机咔嗒、换片声
    - q: Q10
    - q: Q78
    - q: Q77
    - sil: 3
    assets: [M07, W06]
    note: 全片核心镜头之一；不使用任何真实处决影像。 W06：东北大学馆藏的日俄战争幻灯片中没有发现鲁迅所说的那一张，所以用木刻动画重现，并如实说明。
  - id: S2-07
    dur: 25
    visual: 黑场渐亮：木刻风的青年背影，慢慢走出讲堂，走进雪地。
    audio:
    - q: Q11
    - q: Q12
    assets: [M08]
  - id: S2-08
    dur: 16
    visual: 藤野赠照正面→背面“惜别”二字（取得馆方背面图后使用，否则用字幕显示这两个字）；转身字卡“第二次转身｜放下手术刀，去医治人的精神”。
    audio:
    - vo: 1906年春，他退学离开仙台。藤野先生送给他一张照片，背面写着两个字：惜别。这是他的第二次转身：放下手术刀，去医治人的精神。
    assets: [QJ-p496, W30]
    note: W30 目前只取得正面，不得伪造背面。
  - id: S2-09
    dur: 28
    visual: 《河南》杂志刊载《文化偏至论》的书影（“尊个性而张精神”作字幕）→《域外小说集》书影；书店账簿木刻动画，数字“21”停住→1909年杭州合影。
    audio:
    - vo: 回到东京，他在《河南》杂志上发表《文化偏至论》，提出——
    - q: Q79
    - vo: 让每一个中国人成为精神独立的人——这是他一生事业的起点。可《新生》没办成，《域外小说集》第一册只卖出二十一本。1909年，他回国教书。
    assets: [W31, HZ-p43, HZ-p29, QJ-p493]
    note: 思想段落：“立人”是理解他此后一切选择的钥匙。《新生》流产也是下一章“寂寞”的来源。 W31《河南》原刊书影未取得前，用 W29 国图扫描《坟》（1947年版）所收《文化偏至论》首页，字幕注“《坟》1947年版”；原刊第7号可借2014年影印本，或向日本国立国会图书馆申请缩微卷复制。
- id: S3
  title: 三｜北京
  years: 1912—1922
  theme: 从沉默到呐喊
  turn: 第三次转身：沉默的抄碑人，发出第一声呐喊
  shots:
  - id: S3-01
    dur: 14
    visual: 章节卡“三｜北京 1912—1922 从沉默到呐喊”→1912年留影→绍兴会馆旧址门口。
    audio:
    - vo: 1912年，他应教育总长蔡元培之邀进入教育部，5月随部到北京，住进宣武门外的绍兴县馆。
    assets: [QJ-p5514, W08]
  - id: S3-02
    dur: 18
    visual: 补树书屋旧照，夜里一盏灯→碑帖拓片特写，毛笔在灯下一笔一笔抄写。
    audio:
    - vo: 辛亥之后，是复辟，是军阀混战。他白天上班，夜里抄古碑、读佛经。
    - q: Q15
    assets: [QJ-p101, W08, M09]
    note: 碑拓特写可用 W08 新入库的北齐《王龙寺造像》拓片（A级）；字幕只写“北齐《王龙寺造像》拓片”，馆方确认前不写“鲁迅藏”，也不说是他亲手拓或抄的；“毛笔抄写”用木刻风重现（M09）。
  - id: S3-03
    dur: 28
    visual: 会馆院中槐树夜景→木刻风动画“铁屋子”：无窗的铁屋里横卧着熟睡的人；一个人醒来，抬头；铁壁上出现第一道裂缝。
    audio:
    - vo: 那时，老朋友钱玄同常来夜谈，劝他给《新青年》写文章。他说——
    - q: Q17
    - q: Q18
      voice: 换声（第二朗读者，代表“金心异”的话）
    assets: [W08, W40, M10, M09]
    note: 视频号精华版、抖音E3核心镜头。 可选：开头“钱玄同夜谈”可用 W40 电视剧《觉醒年代》（2021）的静音片段（远景或背影，3–5秒）替换槐树夜景；“铁屋子”仍用木刻动画。 原槐树旧照仍未找到：槐树夜景用木刻风（M09）。W08 新入库的绍兴会馆门面是2025年实拍（CC BY-SA 4.0，署名 N509FZ），如用，字幕标“绍兴会馆旧址（今貌）”。
  - id: S3-04
    dur: 25
    visual: 《新青年》4卷5号封面→《狂人日记》首页，“鲁迅”署名特写；历史书页上“仁义道德”的字缝里渗出“吃人”二字（动画）。
    audio:
    - vo: 1918年5月，《狂人日记》发表在《新青年》上，第一次署名“鲁迅”。
    - q: Q57
    - q: Q20
    assets: [W07, HZ-p66, W40, M11, W42]
    note: 可选：开头可接 W40《觉醒年代》灯下写作《狂人日记》的静音片段（如有；只取手、稿纸或背影），角标注“电视剧《觉醒年代》（2021）·曹磊饰”。 可选：“吃人”二字之前可用 W42 赵延年《狂人日记》插图（ART-06），代替AI木刻风画面。
  - id: S3-05
    dur: 10
    visual: 木刻风：一个孩子的眼睛，近景，然后黑场。
    audio:
    - q: Q21
    - sil: 3
    assets: [M12]
  - id: S3-06
    dur: 23
    visual: 《呐喊》1923年8月新潮社初版封面（鲁迅自己设计，字幕“1923年《呐喊》出版”）→1925年为俄译《阿Q正传》所摄照片→各国译本；最后一条乡间土路的远景。转身字卡“第三次转身｜沉默的抄碑人，发出第一声呐喊”。
    audio:
    - vo: 此后几年，孔乙己、阿Q、闰土……一个个从他笔下走了出来。他一直在问自己——
    - q: Q89
    - vo: 这是他的第三次转身：沉默的抄碑人，发出了第一声呐喊。
    assets: [HZ-p76, HZ-p61, HZ-p71, W29, W41, W42]
    note: Q89 出自1925年《俄文译本〈阿Q正传〉序》，正好配 HZ-p61 那张为俄译本拍的照片。Q22“地上本没有路”移到片尾字幕作回声。 可选：旁白“一个个从他笔下走了出来”处，可叠 W41 改编电影（如《祝福》《阿Q正传》）的人物静音画面，每个2–3秒，角标注明片名与年份。 “一个个从他笔下走了出来”优先用 W42 赵延年小说插图《孔乙己》《阿Q正传》《故乡》（ART-07—09），每幅2–3秒，优先于 W41 电影片段；结尾的乡间土路可用《故乡》插图；备用《祝福》《药》等（ART-21—31）。 W29 已找到1923年8月初版封面与版权页（国图扫描，A级）；扫描为黑白、留白大，只推到书名框，彩色高清再向中国现代文学馆或国图索取。
- id: S4
  title: 四｜北京
  years: 1923—1926
  theme: 彷徨与反抗绝望
  turn: 第四次转身：看不见希望，也不向绝望下跪
  shots:
  - id: S4-01
    dur: 11
    visual: 章节卡“四｜北京 1923—1926 彷徨与反抗绝望”→八道湾旧照→西三条外景。
    audio:
    - vo: 1923年，他和弟弟周作人失和，搬出八道湾，后来迁入西三条胡同的小院。
    assets: [QJ-p103, QJ-p498, W08]
  - id: S4-02
    dur: 16
    visual: 《新青年》书影散落→题《彷徨》手迹→《彷徨》封面。
    audio:
    - vo: 《新青年》的同人也散了——
    - q: Q59
    - q: Q24
    assets: [HZ-p62, HZ-p79, HZ-p81]
    note: 《彷徨》封面优先用 HZ-p81；如用 W29 国图扫描，那是1928年3月第五版（北新书局，陶元庆作书面），字幕注“1928年第五版”，不写初版。
  - id: S4-03
    dur: 30
    visual: 《华盖集》《坟》书影→木刻风动画：一条首尾相连的锁链，一环刻着“想做奴隶而不得”，一环刻着“暂时做稳了奴隶”，不停循环；最后一环被撬开，露出一条路。
    audio:
    - vo: 这一时期，他越来越多地拿起杂文。1925年的《灯下漫笔》，把几千年的历史归结为两种时代——
    - q: Q80
    - q: Q81
    assets: [W29, M21, HZ-p117]
    note: 思想段落：国民性批判与“第三样时代”。抖音E7、视频号精华版使用。 《坟》可用 HZ-p117；如用 W29 国图扫描，那是1947年鲁迅全集出版社版，字幕须注明。
  - id: S4-04
    dur: 11
