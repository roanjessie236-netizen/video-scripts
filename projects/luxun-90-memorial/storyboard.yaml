chapters:
- id: S0
  title: 序
  years: 1936.9.5 — 1936.10.22
  theme: 一份不让人纪念的遗嘱
  shots:
  - id: S0-01
    dur: 7.0
    visual: 《死》手稿暗场，大字逐行显出“忘记我／管自己生活。／——倘不，那就真是胡涂虫。”
    audio:
    - q: Q02
    - sfx: 钢笔划纸声；远处旧挂钟滴答
    - mus: 大提琴长音进入（极弱）
    assets:
    - QJ-p2028
    - M01
    note: 样片 v3 素材：QJ-p2028。由 v2.5 的 S0-01（钢笔写“死”）与 S0-03（“忘记我”放大）合并，开篇先亮出“忘记我”
  - id: S0-02
    dur: 12.6
    visual: 沙飞摄《鲁迅葬仪》相片卡 → 《新中华》1936年第4卷第21期《鲁迅先生的丧仪》 → 白旗“民族魂”字卡（闪白、震屏；小字“沈钧儒书”）
    audio:
    - vo: 他不让人纪念。可是出殡那天，许多素不相识的人自发走进送葬的队伍。覆在灵柩上的白旗，写着三个字：民族魂。
    - sfx: 人群脚步声（拟音）
    assets:
    - W02
    - M02
    note: 样片 v3 素材：W02-01、W02-02；排字。原 S0-05。“民族魂”为沈钧儒书（已核）；白旗用字卡，不仿沈钧儒笔迹；送葬人数不写具体数字
  - id: S0-03
    dur: 4.4
    visual: 上海鲁迅墓今貌，年份 1936→2026 滚动
    audio:
    - vo: 九十年过去了，我们没有听他的话。
    assets:
    - M02
    note: 样片 v3 素材：Commons（上海鲁迅墓今貌）。原 S0-06 旁白前半
  - id: S0-04
    dur: 5.0
    visual: 片名“忘记我”（纸面墨字，闪白＋震屏；非鲁迅集字，见 W28），下方“鲁迅逝世九十周年 1936—2026”
    audio:
    - mus: 主题旋律（钢琴+大提琴）第一次完整出现
    assets:
    - M02
    note: 样片 v3 素材：M02 遮罩。片名卡只有音乐
  - id: S0-05
    dur: 15.0
    visual: 大陆新村9号门（实拍） → 《死》手稿第12页（七条遗嘱，红圈原有） → 纸面竖排七条：第二条加深、第三条变红，最后第四条“忘记我，管自己生活”也变红
    audio:
    - vo: 五十五岁那年秋天，他给家人写下几条遗嘱。
    - q: Q71
    - q: Q01
    assets:
    - W01
    - M02
    note: 样片 v3 素材：Commons（大陆新村9号门）；W01-01；排字。原 S0-02。手稿图裁掉图注
  - id: S0-06
    dur: 14.0
    visual: 日历 1.5 秒翻完 44 页，“第 44 天”停 2 秒（背景故居卧室虚化） → 上海鲁迅故居二楼卧室（今貌） → 1936年10月留影相片卡，慢推到眼睛
    audio:
    - vo: 写下这几行字之后的第四十四天，1936年10月19日清晨5点25分，在上海大陆新村九号的寓所里，他停止了呼吸，终年五十五岁。
    assets:
    - M02
    - W11
    - HZ-p231
    note: 样片 v3 素材：排字＋W11；W11-01；HZ-p231。原 S0-04。旁白比画面早约 1.4 秒进入（压在七条遗嘱的尾巴上）
  - id: S0-07
    dur: 10.0
    visual: 信笺“先生：” → 绍兴水巷实拍渐褪为黑白，年份 2026→1881（转入第一章）
    audio:
    - vo: 这一次，就当是写给先生的一封回信。
    assets:
    - M02
    - W04
    note: 样片 v3 素材：排字；W04-04。原 S0-06 旁白后半；水巷转场无旁白
- id: S1
  title: 一｜绍兴
  years: 1881—1898
  theme: 坠入困顿
  turn: 第一次转身：在柜台前，他看见了人心
  shots:
  - id: S1-01
    dur: 6.0
    visual: 章节卡“一｜绍兴”叠绍兴城远景
    audio:
    - sfx: 乌篷船摇橹声、水声
    - mus: 古琴单音
    assets:
    - HZ-p4
    - W04
    note: 样片 v3 素材：HZ-p4
  - id: S1-02
    dur: 13.6
    visual: 周家新台门标牌（实拍）→周家老宅→祖父周福清→“翰林”匾
    audio:
    - vo: 1881年9月25日，他出生在浙江绍兴东昌坊口的周家新台门，本名周樟寿。祖父周福清是翰林，在京城做官。
    assets:
    - HZ-p6
    - HZ-p7
    - HZ-p9
    note: 样片 v3 素材：W04-01、HZ-p6/9/7
  - id: S1-03
    dur: 14.4
    visual: AI：府狱大门铁锁（震屏） → 父亲像卡 → AI：少年跨出台门
    audio:
    - vo: 1893年秋天，祖父因科场案下狱，家道从此中落。第二年冬天，父亲病倒。十三岁的长子，开始替这个家奔走。
    - sfx: 铁锁合上
    assets:
    - M03
    - HZ-p10
    note: 样片 v3 素材：a01；HZ-p10、a03
  - id: S1-04
    dur: 21.0
    visual: AI：长街高墙 → 质铺柜台上的手 → 药店柜台与他一样高 → 高一倍的质铺柜台（按引文分句换镜）
    audio:
    - q: Q05
    - sfx: 算盘珠声；当铺伙计报价的含混人声
    assets:
    - M04
    note: 样片 v3 素材：a04、a06、a07、a05。视频号精华版、抖音E1核心镜头。
  - id: S1-05
    dur: 15.0
    visual: AI：四味药引静物，缓摇，逐个标注 → AI：床帐旁油灯，渐暗
    audio:
    - q: Q49
    - vo: 1896年10月，父亲还是走了，年仅三十七岁。
    assets:
    - M05
    note: 样片 v3 素材：a08；a09
  - id: S1-06
    dur: 17.0
    visual: AI：巷中窃语 → 亲戚俯视 → 转身卡“第一次转身｜在柜台前，他看见了人心”（闪白、震屏）
    audio:
    - q: Q06
    - vo: 这是他的第一次转身：在柜台前，他看见了人心。
    assets:
    - M02
    note: 样片 v3 素材：a10、a11；排字
  - id: S1-07
    dur: 24.5
    visual: 维新派报刊书影 → AI：晨雾石桥背影望乌篷船 → 母亲鲁瑞像卡 → AI：母亲的手把川资放到他手里 → 赵延年木刻《离家》
    audio:
    - vo: 1898年，他决定去南京，进不收学费的新式学堂——
    - q: Q07
    - q: Q08
    - sfx: 摇橹声渐远
    assets:
    - HZ-p11
    - HZ-p10
    - W04
    note: 样片 v3 素材：HZ-p11；a12；HZ-p10、a13；ART-05。乌篷船用 W04 已入库的绍兴乌篷船照片缓推（CC BY-SA 3.0，片尾署名）；水面波纹可自行实拍。南京的画面放到下一章开头。
- id: S2
  title: 二｜南京·东京·仙台
  years: 1898—1909
  theme: 弃医从文
  turn: 第二次转身：放下手术刀，去医治人的精神
  shots:
  - id: S2-01
    dur: 4.0
    visual: 章节卡“二｜南京·东京·仙台　1898—1909 弃医从文”→矿路学堂课本
    audio:
    - mus: 主题旋律变奏（节奏加快）
    assets:
    - HZ-p13
    note: 样片 v3 素材：HZ-p13。不用今南京鲁迅纪念馆外景冒充当年学堂；字幕“鲁迅在矿路学堂用过的课本”。
  - id: S2-02
    dur: 15.2
    visual: 《时务报》与严复像（两张卡先后飞入） → 严复译《天演论》慎始基斋本吴序页 → 排字“物竞天择”（Q52）
    audio:
    - vo: 在南京矿路学堂，他一有闲空，就读严复译的《天演论》。
    - q: Q52
    assets:
    - HZ-p14
    note: 样片 v3 素材：HZ-p14；W05-02；排字。Q52 为1932年的回顾，此处作为“当年的信念”，第五章还会回响一次。 《天演论》早期书影不再找，用画传的《时务报》与严复像。
  - id: S2-03
    dur: 14.3
    visual: 1904年弘文学院毕业照 → 1903年“断发照” → 《自题小像》手迹（1931年重写；Q09）
    audio:
    - vo: 1902年，他官费留学日本。第二年，他剪掉辫子，在这张照片背面题诗，送给好友许寿裳——
    - q: Q09
    assets:
    - QJ-p97
    - HZ-p24
    - HZ-p18
    note: 样片 v3 素材：HZ-p18；QJ-p97；HZ-p24。全集年表：1903年“写七绝诗《自题小像》于‘断发照’背面，赠许寿裳”。HZ-p24 的手迹落款“二十一岁时作，五十一岁时写之，时辛未二月十六日也”，是1931年重写本，字幕注“《自题小像》（1931年重写）”。
  - id: S2-04
    dur: 15.7
    visual: 仙台医学专门学校 → 仙台住处 → 父亲周伯宜（Q51“救治像我父亲似的被误的病人”）
    audio:
    - vo: 1904年秋，他进了仙台医学专门学校。他的梦想很具体——
    - q: Q51
    assets:
    - HZ-p30
    - HZ-p31
    - M07
    note: 样片 v3 素材：HZ-p30；HZ-p31；HZ-p10
  - id: S2-05
    dur: 13.7
    visual: 藤野严九郎 → 解剖学笔记（Q13）
    audio:
    - vo: 解剖学教授藤野严九郎，每星期都要看他的笔记。还回来的时候——
    - q: Q13
    assets:
    - HZ-p33
    - HZ-p34
    note: 样片 v3 素材：HZ-p33；HZ-p34。笔记用画传图（HZ-p34），字幕只写“鲁迅的解剖学笔记（藤野先生批改）”；不用东北大学展陈的复制品，也不写现藏地。
  - id: S2-06
    dur: 26.9
    visual: AI：讲堂里的幻灯机与银幕；介绍卡“情景再现｜日俄战争幻灯片｜仙台医专 · 细菌学课 · 1905—1906” → AI：银幕特写，模糊的示众场面（Q78） → 1904年与仙台医专同学合影（后排右一为鲁迅；“在讲堂里的还有一个我”） → AI：讲堂里举拳欢呼的学生（背面） → AI：前景一动不动的青年背影，渐暗；静音，小字“这张幻灯片至今没有找到，画面为情景再现”
    audio:
    - sfx: 放映机咔嗒、换片声
    - q: Q10
    - q: Q78
    - q: Q77
    - sil: 3
    assets:
    - M07
    note: 样片 v3 素材：b01；HZ-p35；b02；b03。全片核心镜头之一；不使用任何真实处决影像。 W06：东北大学馆藏的日俄战争幻灯片中没有发现鲁迅所说的那一张，所以用木刻动画重现，并如实说明。
  - id: S2-07
    dur: 23.4
    visual: AI：走出讲堂、走进雪地的背影（全景→近景；Q11） → 排字“第一要著｜改变他们的精神｜当然要推文艺”（Q12）
    audio:
    - q: Q11
    - q: Q12
    assets:
    - M08
    note: 样片 v3 素材：b04；排字
  - id: S2-08
    dur: 14.3
    visual: 藤野赠照（正面与背面同页） → 背面“惜别”特写 → 转身卡“第二次转身｜放下手术刀，去医治人的精神”（闪白、震屏）
    audio:
    - vo: 1906年春，他退学离开仙台。藤野先生送给他一张照片，背面写着两个字：惜别。这是他的第二次转身：放下手术刀，去医治人的精神。
    assets:
    - QJ-p496
    note: 样片 v3 素材：QJ-p496；排字。全集彩插 QJ-p496 已同时印出照片与背面题字，不必再向馆方索取背面图；先照片、后题字。
  - id: S2-09
    dur: 25.8
    visual: 1908年《河南》连载《摩罗诗力说》的一页 → 《坟》1947年版《文化偏至论》末页，“其首在立人，人立而後凡事舉”一列渐显红底（Q79） → 1909年东京照 → 《新生》原拟封面画（瓦茨《希望》）→《域外小说集》第一册 → 数字 1→21“本”（底为《域外小说集·序言》手稿虚化） → 1909年杭州（回国任教）
    audio:
    - vo: 回到东京，他在《河南》杂志上发表《文化偏至论》，提出——
    - q: Q79
    - vo: 让每一个中国人成为精神独立的人——这是他一生事业的起点。可《新生》没办成，《域外小说集》第一册只卖出二十一本。1909年，他回国教书。
    assets:
    - HZ-p40
    - W29
    - HZ-p43
    - QJ-p3344
    - HZ-p29
    - QJ-p493
    note: 样片 v3 素材：HZ-p40；Commons NLC416-10jh006112-28811 第53页；HZ-p29；HZ-p39、HZ-p43；排字＋QJ-p3344；QJ-p492。思想段落：“立人”是理解他此后一切选择的钥匙。《新生》流产也是下一章“寂寞”的来源。 《河南》原刊第7号不再找：先用画传所收《河南》连载《摩罗诗力说》的刊页（字幕“1908年《河南》”），再接 W29 国图扫描《坟》（1947年版）所收《文化偏至论》首页，字幕注“《坟》1947年版”。《域外小说集》后可接序言手稿（QJ-p3344）。
- id: S3
  title: 三｜北京
  years: 1912—1922
  theme: 从沉默到呐喊
