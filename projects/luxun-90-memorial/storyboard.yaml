    note: 非鲁迅原文，由旁白读出、字幕注明出处；W33 已核：《毛泽东选集》第二卷（1991年第二版）第698页；“媚骨”后原为逗号，所以引完整句。
  - id: S7-07
    dur: 25
    visual: 今天：课堂上朗读的学生、书店里的《呐喊》、故居门口的参观者、地铁里读书的人；最后回到序章那张稿纸，“忘记我”三个字旁边，慢慢写出“没有忘”。字幕浮出“走的人多了，也便成了路。”
    audio:
    - vo: 先生，九十年过去了。您让我们忘记您，管自己生活——我们会好好生活。只是在黑夜里，我们也想学着您：
