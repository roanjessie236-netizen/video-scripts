    - vo: 1940年，毛泽东在《新民主主义论》里称他是“中国文化革命的主将”，写道：“鲁迅的骨头是最硬的，他没有丝毫的奴颜和媚骨，这是殖民地半殖民地人民最可宝贵的性格。”
    assets: [M02, W33, W26]
    note: 非鲁迅原文，由旁白读出、字幕注明出处；W33 已核：《毛泽东选集》第二卷（1991年第二版）第698页；“媚骨”后原为逗号，所以引完整句。 1940年初版书影不再找，用字卡。
  - id: S7-07
    dur: 25
    visual: 今天（自行实拍）：书店里的《呐喊》、翻开书页的手、故居门口参观者的背影、地铁里读书的人；最后回到序章那张稿纸，“忘记我”三个字旁边，慢慢写出“没有忘”。字幕浮出“走的人多了，也便成了路。”
    audio:
    - vo: 先生，九十年过去了。您让我们忘记您，管自己生活——我们会好好生活。只是在黑夜里，我们也想学着您：
